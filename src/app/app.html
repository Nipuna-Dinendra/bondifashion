<!-- Top promo bar -->
<div class="promo-bar" *ngIf="showPromo" role="region" aria-label="Promotion">
  <div class="container">
    <span class="promo-text">
      Subscribe and get <strong>10% off</strong> your next order now.
      <span class="promo-note">
        Exclusions apply – <a class="promo-link" routerLink="terms">see T&Cs</a>
        <!-- If you don't have a /terms route yet, use: href="/terms" -->
      </span>
    </span>

    <!-- Optional: subscribe CTA -->
    <a class="promo-cta" routerLink="subscribe">Subscribe</a>

    <button class="promo-close" (click)="showPromo = false" aria-label="Hide">×</button>
  </div>
</div>



<header class="topbar">
  <div class="topbar-inner container">
    <!-- Left: hamburger "home" -->
    <div class="left">
      <a class="icon-btn" routerLink="/" aria-label="Home">
        <!-- Hamburger icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sr-only">Home</span>
      </a>
    </div>

    <!-- Center: brand/site name -->
    <a class="brand" routerLink="/">Bondi Fashion</a>

    <!-- Right: account, search, cart -->
    <div class="actions">
      <a class="icon-btn" routerLink="/account" aria-label="Account">
        <!-- User icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.76 0 5-2.24 5-5S14.76 2 12 2 7 4.24 7 7s2.24 5 5 5zM4 20c0-3.31 3.58-6 8-6s8 2.69 8 6"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <button class="icon-btn" (click)="toggleSearch()" aria-label="Search">
        <!-- Search icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </button>

      <a class="icon-btn cart-btn" routerLink="/cart" aria-label="Cart">
        <!-- Cart icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="21" r="1.8" />
          <circle cx="18" cy="21" r="1.8" />
          <path d="M2 3h3l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>
    </div>
  </div>
</header>

<!-- Optional search row below the top bar -->
<div class="search-row" *ngIf="showSearch">
  <div class="container search-inner">
    <input type="text" placeholder="Search products…" />
    <button class="search-go" (click)="toggleSearch()">Close</button>
  </div>
</div>



<header class="site-header">
  <div class="container">
    <h2 class="site-title">Bondi Fashion</h2>
    <nav>
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="about" routerLinkActive="active">About</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="card">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <small>© {{ year }} My Site</small>
  </div>
</footer>
